name: Android Build - Hisab Kitab Khata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: HisabKitabKhata

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Build Release AAB
        run: gradle bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Kitab-Khata-Build
          path: |
            HisabKitabKhata/app/build/outputs/apk/*/.apk
            HisabKitabKhata/app/build/outputs/bundle/*/.aab
          if-no-files-found: error
          retention-days: 14
